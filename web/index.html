<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>GeoCluster 2.0 — Remote Sensing Workstation</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- ───────────────────────── application header ───────────────────────── -->
    <header class="app-header">
      <div class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">GC</span>
          <h1>GeoCluster <span>2.0</span></h1>
        </div>
        <nav class="menubar" id="menubar" aria-label="Main menu"></nav>
        <div class="titlebar-right">
          <div class="chips" id="status-chips" aria-label="Server status"></div>
        </div>
      </div>

      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Viewer and processing toolbar">
        <div class="tb-group" role="group" aria-label="Data">
          <button class="tb-btn icon-btn" id="tb-open" type="button" title="Open an image (Ctrl+O)">
            <span class="tb-label">Open</span>
          </button>
          <button class="tb-btn icon-btn" id="tb-satellite" type="button" title="Fetch a Sentinel-2 tile">
            <span class="tb-label">Satellite</span>
          </button>
          <button class="tb-btn icon-btn" id="tb-export" type="button" title="Export the current image as PNG">
            <span class="tb-label">Export</span>
          </button>
          <button class="tb-btn icon-btn" id="tb-compress" type="button" title="Compress the current image to .gch (GCH2)">
            <span class="tb-label">Compress</span>
          </button>
        </div>

        <span class="tb-sep" role="separator"></span>

        <div class="tb-group" role="group" aria-label="History">
          <button class="tb-btn icon-btn" id="tb-undo" type="button" disabled title="Nothing to undo yet — run an operation first">
            <span class="tb-label">Undo</span>
          </button>
          <button class="tb-btn icon-btn" id="tb-redo" type="button" disabled title="Nothing to redo — undo a step first">
            <span class="tb-label">Redo</span>
          </button>
        </div>

        <div class="tb-group" role="group" aria-label="Tools">
          <button class="tb-btn icon-btn toggle" id="tb-pan" type="button" aria-pressed="true" title="Allow drag-to-pan on the viewers">
            <span class="tb-label">Pan</span>
          </button>
          <button class="tb-btn icon-btn toggle" id="tb-pixel" type="button" aria-pressed="true" title="Live pixel readout under the cursor">
            <span class="tb-label">Pixel</span>
          </button>
          <button class="tb-btn icon-btn toggle" id="tb-measure" type="button" aria-pressed="false" title="Measure a distance on the active viewer (two clicks, Esc clears)">
            <span class="tb-label">Measure</span>
          </button>
          <button class="tb-btn icon-btn toggle" id="tb-sync" type="button" aria-pressed="false" title="Synchronise zoom and pan between Original and Result">
            <span class="tb-label">Sync</span>
          </button>
        </div>

        <div class="tb-group tb-right" role="group" aria-label="Panels">
          <button class="tb-btn icon-btn toggle" id="tb-map" type="button" aria-pressed="false" title="Show the classified map (image + legend) — run Classify first">
            <span class="tb-label">Map</span>
          </button>
          <button class="tb-btn icon-btn" id="tb-toggle-toolbox" type="button" title="Show or hide the toolbox">
            <span class="tb-label">Toolbox</span>
          </button>
          <button class="tb-btn icon-btn" id="tb-toggle-assistant" type="button" title="Show or hide the assistant">
            <span class="tb-label">Assistant</span>
          </button>
        </div>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <!-- ─────────────────────────── workspace ─────────────────────────── -->
    <main class="workspace" id="workspace">
      <aside class="dock dock-left" id="toolbox" aria-label="Toolbox">
        <div class="dock-head">
          <span class="dock-title">Toolbox</span>
          <button class="dock-collapse" id="toolbox-collapse" type="button" title="Collapse the toolbox">&lsaquo;</button>
        </div>
        <div class="dock-body" id="toolbox-sections"></div>
      </aside>

      <section class="image-workspace" id="viewer-area" aria-label="Image workspace">
        <div class="viewer-slot" id="viewer-original"></div>
        <div class="viewer-slot" id="viewer-result"></div>
        <div class="viewer-slot" id="viewer-map" hidden></div>
      </section>

      <aside class="dock dock-right" id="assistant-dock" aria-label="Assistant">
        <div class="dock-head">
          <span class="dock-title">Assistant</span>
          <button class="dock-collapse" id="assistant-collapse" type="button" title="Collapse the assistant">&rsaquo;</button>
        </div>
        <div class="dock-body" id="chat-column"></div>
      </aside>

      <button class="dock-reopen dock-reopen-left" id="toolbox-reopen" type="button" hidden title="Show the toolbox">Toolbox</button>
      <button class="dock-reopen dock-reopen-right" id="assistant-reopen" type="button" hidden title="Show the assistant">Assistant</button>
    </main>

    <!-- ─────────────────────────── status bar ─────────────────────────── -->
    <footer class="statusbar" id="statusbar">
      <span class="sb-item" id="sb-message"></span>
      <span class="sb-spacer"></span>
      <span class="sb-item" id="sb-source" title="Working image"></span>
      <span class="sb-item" id="sb-size" title="Image dimensions"></span>
      <span class="sb-item" id="sb-mode" title="Stored channel layout"></span>
      <span class="sb-item" id="sb-zoom" title="Zoom of the active viewer"></span>
      <span class="sb-item" id="sb-cursor" title="Cursor position in image pixels"></span>
      <span class="sb-item" id="sb-pixel" title="Pixel value under the cursor"></span>
      <span class="sb-item sb-active-viewer" id="sb-viewer" title="Active viewer"></span>
      <span class="sb-item" id="sb-lastop" title="Last operation"></span>
      <span class="sb-item" id="sb-history" title="Undo history"></span>
      <span class="sb-item" id="sb-session" title="Session"></span>
      <span class="sb-item" id="sb-api" title="API base URL"></span>
      <button class="sb-button" id="new-session" type="button" title="Start a new session (clears the server-side images)">New session</button>
    </footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <noscript>
      <p class="noscript">The GeoCluster web console needs JavaScript enabled.</p>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
